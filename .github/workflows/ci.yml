name: Tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - uses: actions/upload-artifact@v4
        with:
          name: merchant-console-source
          path: |
            server.py
            dashboard.html
            README.md
