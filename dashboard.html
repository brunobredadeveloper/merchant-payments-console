<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Breda · Merchant Console</title><style>body{font:16px system-ui;background:#101725;color:#edf3ff;margin:0;padding:32px;max-width:1100px;margin:auto}h1{font-size:32px}small{color:#adbbd4}button,input,select{font:inherit;padding:10px;border-radius:8px;margin:4px;border:1px solid #54627b}button{background:#82e2be;cursor:pointer}section{padding:20px;background:#1c283c;border-radius:16px;margin:20px 0}table{width:100%;border-collapse:collapse}td,th{padding:12px;text-align:left;border-bottom:1px solid #45516b}#message{min-height:24px;color:#ffd992}.cards{display:flex;gap:20px;flex-wrap:wrap}.cards strong{display:block;font-size:26px}code{overflow-wrap:anywhere}@media(max-width:600px){body{padding:12px}table{font-size:12px}td,th{padding:6px}}</style><h1>Breda / Merchant Console</h1><small>Laboratório de pagamentos fictícios · nenhum cartão ou dinheiro real</small><section class="cards"><div>Vendas aprovadas<strong id="total">—</strong></div><div>Operações<strong id="count">—</strong></div><div>Estornado<strong id="refunds">—</strong></div></section><section><h2>Nova cobrança de demonstração</h2><form id="form"><label>Valor R$ <input id="amount" type="number" min="0.01" max="1000000" step="0.01" value="25.90" required></label><label>Cenário <select id="scenario"><option value="approve">Aprovar</option><option value="decline">Recusar</option><option value="lost_response">Resposta atrasada</option></select></label><button>Cobrar</button></form><p id="message" role="status"></p></section><section><h2>Operações e conciliação</h2><button id="refresh">Atualizar</button><table><thead><tr><th>Referência</th><th>Valor</th><th>Situação</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></section><script>
const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n/100);let key=crypto.randomUUID();
async function api(url,body){const r=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const d=await r.json();if(!r.ok)throw Error(d.error);return d}
async function refresh(){try{const list=await api('/api/payments');$('total').textContent=money(list.filter(p=>p.status==='approved').reduce((s,p)=>s+p.amount,0));$('refunds').textContent=money(list.filter(p=>p.status==='refunded').reduce((s,p)=>s+p.amount,0));$('count').textContent=list.length;$('rows').replaceChildren();for(const p of list){const tr=document.createElement('tr');for(const value of [p.id.slice(0,8),money(p.amount),p.status]){const td=document.createElement('td');td.textContent=value;tr.append(td)}const actions=document.createElement('td');if(p.status==='approved'){const b=document.createElement('button');b.textContent='Estornar';b.onclick=()=>act(()=>api('/api/payments/'+p.id+'/refund',{}));actions.append(b)}const event=document.createElement('button');event.textContent='Repetir evento';event.onclick=()=>act(async()=>{const data={eventId:'demo-'+p.id,paymentId:p.id,kind:p.scenario==='decline'?'declined':'approved'};await api('/api/events',data);const duplicate=await api('/api/events',data);$('message').textContent='Evento duplicado ignorado: '+duplicate.duplicate});actions.append(event);tr.append(actions);$('rows').append(tr)}}catch(e){$('message').textContent=e.message}}
async function act(fn){try{await fn();await refresh()}catch(e){$('message').textContent=e.message}}
$('form').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const p=await api('/api/payments',{idempotencyKey:key,amountInCents:Math.round(Number($('amount').value)*100),scenario:$('scenario').value});$('message').textContent=p.status+' · '+p.id;key=crypto.randomUUID();await refresh()}catch(e){$('message').textContent=e.message+' — tente novamente com a mesma chave'}finally{b.disabled=false}};$('refresh').onclick=refresh;refresh();
</script></html>
